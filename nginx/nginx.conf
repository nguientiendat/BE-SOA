events {
    worker_connections 1024;
}

http {
    # [THÊM MỚI] 1. Định nghĩa vùng nhớ lưu trạng thái Limit
    # - $binary_remote_addr: Dùng địa chỉ IP làm khóa (key) để đếm.
    # - zone=api_limit:10m: Tên vùng nhớ là 'api_limit', kích thước 10MB (lưu được khoảng 160,000 IP).
    # - rate=20r/s: Giới hạn 20 request mỗi giây. (Nếu muốn 20 request/phút thì sửa thành 20r/m).
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    # [THÊM MỚI] 2. Trả về mã lỗi 429 (Too Many Requests) thay vì 503 mặc định
    limit_req_status 429;

    server {
        listen 80;
        server_name api.nguientiendat.online;
        
        # [THÊM MỚI] 3. Áp dụng Limit cho toàn bộ Server này
        # - burst=10: Cho phép "nổ" (vượt rào) thêm 10 request nữa để xử lý các đợt truy cập đột ngột (spike).
        # - nodelay: Xử lý các request burst ngay lập tức, không bắt user chờ đợi.
        # => Tổng cộng user có thể gửi tối đa 30 req (20 + 10 burst) trong giây đầu tiên, sau đó về ổn định 20r/s.
        limit_req zone=api_limit burst=10 nodelay;

        # Common proxy settings
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # === SOCKET.IO / NOTIFICATION ===
        location /socket.io/ {
            # Socket.IO cần kết nối liên tục, nên thường ta sẽ NỚI LỎNG hoặc TẮT limit ở đây
            # Nếu muốn tắt hẳn limit cho socket:
            # limit_req_zone off; 

            proxy_pass http://notification:3010/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' 'https://nguientiendat.online' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # === NOTIFICATION API ===
        location /api/notification/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://nguientiendat.online' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain';
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' 'https://nguientiendat.online' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

            proxy_pass http://notification:3010/;
        }

        # === PRODUCTS ===
        location /api/products/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://nguientiendat.online' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain';
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' 'https://nguientiendat.online' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

            proxy_pass http://product-service:3002/;
        }

        # === ORDERS ===
        location /api/orders/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://nguientiendat.online' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain';
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' 'https://nguientiendat.online' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

            proxy_pass http://order-service:3005/;
        }

        # === AUTH ===
        location /api/auth/ {
            # Với Auth, có thể bạn muốn siết chặt hơn (ví dụ tránh brute-force)
            # Bạn có thể tạo thêm 1 zone khác (login_limit) 5r/s và áp dụng riêng ở đây.
            
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://nguientiendat.online' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400 always;
