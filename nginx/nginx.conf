# Cấu hình cơ bản
events {}

http {
    server {
        # Nginx sẽ lắng nghe ở cổng 80 (cổng HTTP mặc định)
        listen 80;
    # 1. Điều hướng cho Product Service
    # Khi có request đến /api/products/...
    location /api/products/ {
        # Nginx sẽ chuyển tiếp nó đến service của bạn
        # LƯU Ý: Dùng tên service 'product-service' (từ file docker-compose.yml)
        proxy_pass http://product-service:3002/;
        
        # Các header quan trọng để service của bạn nhận đúng thông tin
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/orders/ {
        # Chuyển tiếp đến service 'order-service' ở cổng 3005
        proxy_pass http://order-service:3005/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
        # Chuyển tiếp đến service 'auth-service' ở cổng 3001
        proxy_pass http://auth-service:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/cart/ {
        # Chuyển tiếp đến service 'cart-service' ở cổng 3003
        proxy_pass http://cart-service:3003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/payment/ {
        # Chuyển tiếp đến service 'payment-service' ở cổng 3004
        proxy_pass http://payment-service:3004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; 
}
}
}

