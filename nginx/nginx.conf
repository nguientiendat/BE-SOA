# Cấu hình cơ bản
events {}

http {
    server {
        # Nginx sẽ lắng nghe ở cổng 80 (cổng HTTP mặc định)
        listen 80;

        # 1. Điều hướng cho Product Service
        # Khi có request đến /api/products/...
        location /api/products/ {
            # SỬA LỖI: Dùng tên service 'product-service' (từ file docker-compose.yml)
            proxy_pass http://localhost:3002/;
            
            # Các header quan trọng để service của bạn nhận đúng thông tin
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Điều hướng cho Order Service
        location /api/orders/ {
            # SỬA LỖI: Dùng tên service 'order-service' ở cổng 3005
            proxy_pass http://localhost:3005/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Điều hướng cho Auth Service
        location /api/auth/ {
            # SỬA LỖI: Dùng tên service 'auth-service' ở cổng 3001
            proxy_pass http://localhost:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Điều hướng cho Cart Service
        location /api/cart/ {
            # SỬA LỖI: Dùng tên service 'cart-service' ở cổng 3003
            proxy_pass http://localhost:3003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # 5. Điều hướng cho Payment Service
        location /api/payment/ {
            # SỬA LỖI: Dùng tên service 'payment-service' ở cổng 3004
            proxy_pass http://localhost:3004/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}