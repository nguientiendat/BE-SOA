version: '3.8'

services:
  zookeeper:
    image: 'bitnami/zookeeper:latest'
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - microservices-network
    restart: unless-stopped
  # Auth Service
  kafka:
    image: 'bitnami/kafka:latest'
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
    networks:
      - microservices-network
    restart: unless-stopped
  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MONGO_URI=mongodb://mongodb:27017/auth_service
      - JWT_SECRET=your-super-secret-jwt-key-here
      - KAFKA_BROKER=localhost:9092
    depends_on:
      - mongodb
    networks:
      - microservices-network

  # Product Service
  product-service:
    build: ./services/product-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - MONGO_URI=mongodb://mongodb:27017/product_service
      - JWT_SECRET=your-super-secret-jwt-key-here
    depends_on:
      - mongodb
    networks:
      - microservices-network
    restart: unless-stopped
  cart-service:
    build: ./services/cart-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - MONGO_URI=mongodb://mongodb:27017/cart_service
      - JWT_SECRET=your-super-secret-jwt-key-here
    depends_on:
      - mongodb
    networks:
      - microservices-network
    restart: unless-stopped
  order-service:
    build: ./services/order-service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - MONGO_URI=mongodb://mongodb:27017/order_service
      - JWT_SECRET=your-super-secret-jwt-key-here
    depends_on:
      - mongodb
    networks:
      - microservices-network
    restart: unless-stopped
  # Using existing Kafka services (external)
  payment-service:
    build: ./services/payment-service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - MONGO_URI=mongodb://mongodb:27017/payment_service
      - KAFKA_BROKER=kafka:9092
      - JWT_SECRET=your-super-secret-jwt-key-here
    depends_on:
      - mongodb
    networks:
      - microservices-network
    restart: unless-stopped
  email-service:
    build: ./services/email-service
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=development
      - PORT=3006
      - MONGO_URI=mongodb://mongodb:27017/email_service
      - SMTP_HOST=smtp.example.com
      - SMTP_PORT=587
      - SMTP_USER=your_smtp_user
      - SMTP_PASS=your_smtp_password
    depends_on:
      - mongodb
    networks:
      - microservices-network
    restart: unless-stopped
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - microservices-network

volumes:
  mongodb_data:

networks:
  microservices-network:
    driver: bridge

